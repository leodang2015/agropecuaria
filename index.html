<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroControl - Sistema Agropecuario y Gestión de Cultivos</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-[#F4F6F5] text-slate-800 min-h-screen flex flex-col antialiased selection:bg-emerald-200">
    <!-- App Container -->
    <div id="app-wrapper" class="flex-1 flex flex-col min-h-screen">
      <!-- Main Logged-In Layout -->
      <div id="app-layout" class="flex-1 flex flex-col md:flex-row min-h-screen hidden">
        <!-- Sidebar Navigation (Mockup dark forest green) -->
        <aside class="w-full md:w-64 bg-[#0D2E20] text-slate-200 flex-shrink-0 flex flex-col justify-between border-r border-[#154230] z-20">
          <div>
            <!-- Brand Logo Header -->
            <div class="flex items-center gap-2.5 px-6 py-5 border-b border-[#164431]">
              <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center text-emerald-400 shadow-inner">
                <i data-lucide="sprout" class="w-5 h-5"></i>
              </div>
              <div>
                <span class="text-white font-bold text-lg tracking-tight block leading-tight">
                  AgroControl
                </span>
                <span class="text-[10px] text-emerald-300/80 font-medium tracking-wide">
                  Gestión Agropecuaria
                </span>
              </div>
            </div>

            <!-- Navigation Links -->
            <nav id="sidebar-nav" class="p-3 space-y-1">
              <!-- Rendered dynamically by index.js -->
            </nav>
          </div>

          <!-- Sidebar Footer Credits / Version -->
          <div class="p-4 mx-3 mb-4 rounded-xl bg-[#092217] border border-[#143d2c] text-xs text-slate-300">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">AgroControl SENA</span>
              <span class="text-[9px] bg-emerald-900/60 text-emerald-300 px-1.5 py-0.5 rounded border border-emerald-700/50">ADSO</span>
            </div>
            <p class="text-[11px] text-slate-300 font-medium leading-snug">Sistema de Gestión & Monitoreo</p>
            <p class="text-[10px] text-slate-400 mt-1 line-clamp-1" title="Omar Dangond · Deyner Herrera · Hervis Castellano · Daniel Vesga">
              Dangond · Herrera · Castellano · Vesga
            </p>
          </div>
        </aside>

        <!-- Main Workspace (Topbar + View Content) -->
        <div class="flex-1 flex flex-col min-w-0 bg-[#F4F6F5]">
          <!-- Topbar (White bar with Finca selector, search, notifications, user avatar) -->
          <header class="bg-white border-b border-slate-200/90 px-4 sm:px-6 py-3 flex items-center justify-between gap-4 sticky top-0 z-10 shadow-xs">
            <!-- Left: Finca Dropdown Selector -->
            <div class="flex items-center gap-3">
              <div class="relative">
                <select id="topbar-finca-select" onchange="window.handleFincaChange(this.value)" class="appearance-none bg-slate-50 hover:bg-slate-100 text-slate-800 font-bold text-xs sm:text-sm pl-3 pr-8 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 cursor-pointer transition-all shadow-2xs">
                  <option value="ter-1">Finca Las Palmas</option>
                  <option value="ter-2">Finca El Paraíso</option>
                  <option value="ter-3">Finca La Esperanza</option>
                  <option value="ter-4">Finca San José</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 absolute right-2.5 top-2.5 pointer-events-none"></i>
              </div>
            </div>

            <!-- Center: Search Input -->
            <div class="hidden sm:block flex-1 max-w-md mx-2">
              <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                <input
                  type="text"
                  id="topbar-search-input"
                  oninput="window.handleGlobalSearch(this.value)"
                  placeholder="Buscar fincas, lotes, cultivos, sensores..."
                  class="w-full pl-9 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition-all placeholder:text-slate-400"
                />
              </div>
            </div>

            <!-- Right: Notifications & User Profile -->
            <div id="header-user-controls" class="flex items-center gap-3">
              <!-- Rendered by index.js -->
            </div>
          </header>

          <!-- Dynamic Viewport Content -->
          <main id="main-content" class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto min-w-0">
            <!-- Rendered by index.js -->
          </main>
        </div>
      </div>

      <!-- Login View Container (Shown when logged out) -->
      <div id="login-container" class="flex-1 flex items-center justify-center p-4 sm:p-6 bg-slate-100">
        <!-- Rendered by index.js -->
      </div>
    </div>

    <!-- Modal Dialog Overlay Container -->
    <div id="modal-container"></div>

    <!-- App JavaScript Logic -->
    <script type="module" src="/index.js"></script>
  </body>
</html>
